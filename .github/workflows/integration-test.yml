name: integration-test

on:
  push:
    branches: [master, testing]
  pull_request:

concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - name: bookworm
            dockerfile: Dockerfile-bookworm
            supports_setup: true
          - name: trixie
            dockerfile: Dockerfile-trixie
            supports_setup: true
          - name: distroless
            dockerfile: Dockerfile-distroless
            supports_setup: false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f "${{ matrix.image_variant.dockerfile }}" \
            -t "proxmox-qdevice-test:${{ matrix.image_variant.name }}" \
            .

      - name: Verify qnetd and healthcheck in runtime mode
        run: |
          set -euo pipefail

          CONTAINER_ID=$(docker run -d "proxmox-qdevice-test:${{ matrix.image_variant.name }}")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{ .State.Health.Status }}' "$CONTAINER_ID")
            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$CONTAINER_ID"
          docker inspect "$CONTAINER_ID"
          exit 1

      - name: Verify sshd in setup mode
        if: ${{ matrix.image_variant.supports_setup }}
        run: |
          set -euo pipefail

          CONTAINER_ID=$(docker run -d \
            -e QDEVICE_MODE=setup \
            -e ROOT_PASSWORD=testpwd \
            "proxmox-qdevice-test:${{ matrix.image_variant.name }}")
          trap 'docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true' EXIT

          sleep 5
          docker exec "$CONTAINER_ID" pgrep sshd

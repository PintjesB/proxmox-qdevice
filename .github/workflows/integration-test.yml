name: integration-test

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Build the container image from the repository.  We change into
      # the proxmox-qdevice-master subdirectory because GitHub checks
      # out the entire repository by default.
      - name: Build Docker image
        run: |
          cd proxmox-qdevice-master
          docker build -t proxmox-qdevice-test .

      # Ensure that in runtime mode the corosync-qnetd daemon starts and
      # remains running.  We run the container in detached mode,
      # wait a few seconds for startup and then search for the qnetd
      # process inside the container.  If the process cannot be
      # found, pgrep will return a non‑zero exit code and cause the job
      # to fail.
      - name: Verify qnetd and healthcheck in runtime mode
        run: |
          set -e
          # Run the container in runtime mode.  We omit QNETD_ENABLED because qnetd always runs.
          CONTAINER_ID=$(docker run -d -e QDEVICE_MODE=runtime proxmox-qdevice-test)
          # Wait for the daemon and healthcheck to initialise
          sleep 10
          # Ensure the qnetd process is present
          docker exec "$CONTAINER_ID" pgrep corosync-qnetd
          # Ensure the container reports healthy state via the Docker healthcheck
          docker inspect --format='{{ .State.Health.Status }}' "$CONTAINER_ID" | grep -q healthy
          docker rm -f "$CONTAINER_ID"

      # Ensure that in setup mode the SSH daemon starts.  We set a
      # temporary root password because the entrypoint will refuse to
      # start SSH without authentication material.  After a short
      # delay we verify that sshd is running.
      - name: Verify sshd in setup mode
        run: |
          set -e
          CONTAINER_ID=$(docker run -d -e QDEVICE_MODE=setup -e ROOT_PASSWORD=testpwd proxmox-qdevice-test)
          sleep 5
          docker exec $CONTAINER_ID pgrep sshd
          docker rm -f $CONTAINER_ID
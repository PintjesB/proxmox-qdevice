name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - testing
    tags:
      - "v*"
    paths:
      - Dockerfile-bookworm
      - Dockerfile-trixie
      - Dockerfile-distroless
      - entrypoint.sh
      - validate_env.sh
      - .github/workflows/docker-image.yml
  pull_request:
    branches:
      - master
      - main
      - testing
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - name: bookworm
            dockerfile: Dockerfile-bookworm
          - name: trixie
            dockerfile: Dockerfile-trixie
          - name: distroless-runtime
            dockerfile: Dockerfile-distroless

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: |
          echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Determine publish mode
        id: publish
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ steps.publish.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=${{ matrix.image_variant.name }}
            type=sha,prefix=${{ matrix.image_variant.name }}-
            type=ref,event=branch,prefix=${{ matrix.image_variant.name }}-
            type=ref,event=tag,prefix=${{ matrix.image_variant.name }}-

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image_variant.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
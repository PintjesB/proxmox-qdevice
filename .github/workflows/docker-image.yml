name: Docker Image CI

on:
  push:
    branches: [master, testing]
    paths:
      - Dockerfile-bookworm
      - Dockerfile-trixie
      - Dockerfile-distroless
      - entrypoint.sh
      - validate_env.sh
      - .github/workflows/docker-image.yml
  pull_request:
    branches: [master, testing]
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: proxmox-qdevice
  PLATFORMS: linux/amd64,linux/arm64
  IMAGE_PUSH: ${{ vars.IMAGEPUSH || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - name: bookworm
            dockerfile: Dockerfile-bookworm
          - name: trixie
            dockerfile: Dockerfile-trixie
          - name: distroless
            dockerfile: Dockerfile-distroless

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine publish mode
        id: publish
        shell: bash
        run: |
          SHOULD_PUSH="false"

          if [[ "${{ github.actor }}" != "dependabot[bot]" \
            && "${{ github.event_name }}" != "pull_request" \
            && "${IMAGE_PUSH}" == "true" ]]; then
            SHOULD_PUSH="true"
          fi

          echo "should_push=${SHOULD_PUSH}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: ${{ steps.publish.outputs.should_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,priority=1000,value=${{ matrix.image_variant.name }}
            type=schedule,priority=800,pattern={{date 'YYYYMMDD'}},prefix=${{ matrix.image_variant.name }}-
            type=sha,priority=400,prefix=${{ matrix.image_variant.name }}-
          flavor: |
            latest=false

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image_variant.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.publish.outputs.should_push == 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

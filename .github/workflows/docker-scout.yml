name: Docker Scout vulnerability scan

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-scout-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: proxmox-qdevice

jobs:
  scan:
    if: ${{ vars.IMAGEPUSH == 'true' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image_variant: [bookworm, trixie, distroless]

    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Scout against GHCR
        uses: docker/scout-action@v1.18.2
        with:
          command: quickview,cves,recommendations
          image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.image_variant }}
          ignore-unchanged: true
          only-severities: critical,high
          github-token: ${{ secrets.GITHUB_TOKEN }}
